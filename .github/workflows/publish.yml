name: Publish to Marketplace
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check publisher
        run: node -e "const p = require('./package.json'); if (!p.publisher || p.publisher === 'remote-sync-local') throw new Error('Configure your registered Marketplace publisher before publishing');"
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - name: Publish the packaged VSIX
        shell: bash
        run: |
          extension_version=$(node -p "require('./package.json').version")
          npx --no-install vsce publish --oidc --packagePath "remote-sync-workspace-$extension_version.vsix"
